<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carnet de pension · Pensionsbuch</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
  <header class="topbar no-print">
    <div class="brand"><span class="logo" aria-hidden="true">🐴</span> <span data-t="appName">Carnet de pension</span></div>
    <div class="lang-switch">
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="de">DE</button>
    </div>
  </header>
  <p class="proto-banner no-print" data-t="prototype">Prototype – version de test</p>

  <nav class="tabs no-print" role="tablist">
    <button type="button" role="tab" data-tab="log" class="active" data-t="tabLog">Noter</button>
    <button type="button" role="tab" data-tab="month" data-t="tabMonth">Factures du mois</button>
    <button type="button" role="tab" data-tab="setup" data-t="tabSetup">Réglages</button>
  </nav>

  <main class="no-print">
    <section id="tab-log" class="tab-panel"></section>
    <section id="tab-month" class="tab-panel" hidden></section>
    <section id="tab-setup" class="tab-panel" hidden></section>
  </main>

  <div id="print-area" class="print-only"></div>
  <div id="toast" class="toast no-print" role="status" aria-live="polite"></div>

  <footer class="no-print small muted" data-t="privacy">Aucune donnée ne quitte cet appareil. Pas de compte.</footer>

  <script src="js/billing.js"></script>
  <script src="js/qrcode.js"></script>
  <script src="js/qrbill.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
