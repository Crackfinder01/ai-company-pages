name: Sync cloud work to main

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: sync-to-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge the claude branch into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "ai-company-sync"
          git config user.email "ai-company-sync@users.noreply.github.com"
          git fetch origin "$BRANCH"
          if git diff --name-only HEAD...FETCH_HEAD | grep -E '^\.github/'; then
            echo "Workflow files changed on $BRANCH: merge refused." >&2
            exit 1
          fi
          git merge --no-edit FETCH_HEAD
          git push origin main
          git push origin --delete "$BRANCH" || true
